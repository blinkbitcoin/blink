# The price service replaces its default quotes array when this array is present.
# Keep USD and EUR here, and exercise configured precision with PKR and XTS.
quotes:
  - code: "USD"
    symbol: "$"
    name: "US Dollar"
    flag: "🇺🇸"
    fractionDigits: 2
  - code: "EUR"
    symbol: "€"
    name: "Euro"
    flag: "🇪🇺"
    fractionDigits: 2
  - code: "PKR"
    symbol: "₨"
    name: "Pakistani Rupee"
    flag: "🇵🇰"
    fractionDigits: 2
  # ISO 4217 testing code; deliberately configured with non-ICU precision.
  - code: "XTS"
    symbol: "¤"
    name: "Test Currency"
    flag: "🧪"
    fractionDigits: 0
  - code: "COP"
    symbol: "$"
    name: "Colombian Peso"
    flag: "🇨🇴"
    fractionDigits: 2

exchanges:
  - provider: "dev-mock"
    base: "BTC"
    quote: "*"
    enabled: true
    config:
      devMockPrice:
        BTC:
          EUR: 17500
          PKR: 5600000
          XTS: 2000000
          COP: 200000000
          USD: 20000
    # Following require dummy values
    name: ""
    cron: "*/5 * * * * *"
