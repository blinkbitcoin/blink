name: "E2e test"

on:
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: execute via bats
    runs-on: [self-hosted, blink, heavy]
    env:
      # The heavy runner has enough CPU to compile more Buck actions in parallel.
      BUCK2_JOBS: "8"
    # The full suite needs ~35 minutes on the self-hosted runners (buck2 builds
    # plus stack boot take ~16 minutes before the 234 tests start).
    timeout-minutes: 40
    steps:
      # A run killed by timeout or cancellation never executes Tilt's teardown,
      # leaving the compose stack running (holding ports) and root-owned files
      # in the workspace (lnurl-server runs as root and writes into dev/.data,
      # which makes the next checkout fail with EACCES). Clean both up front.
      - name: Clean up leftovers from previous runs
        run: |
          docker ps -aq --filter "name=galoy-dev" | xargs -r docker rm -f
          docker network rm galoy-dev_default 2>/dev/null || true
          if [ -d "$GITHUB_WORKSPACE/dev/.data" ]; then
            docker run --rm -v "$GITHUB_WORKSPACE:/ws" busybox rm -rf /ws/dev/.data
          fi

      - uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v14

      - name: Run bats tests
        run: |
          nix develop -c ./bats/ci_run.sh

      - name: Rename Tilt log
        if: always()
        run: mv bats/.e2e-tilt.log bats/e2e-tilt.log

      - name: Upload Tilt log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Tilt log
          path: bats/e2e-tilt.log
