name: CI task tests

on:
  pull_request:
    paths:
      - ci/core/tasks/bump-image-digest.sh
      - ci/core/tasks/open-charts-pr.sh
      - ci/core/tasks/test-api.sh
      - ci/core/*.yml
      - core/api/BUCK
      - ci/core/tasks/tests/**
      - ci/tests/**
      - .github/workflows/integration-test.yml
      - toolchains/workspace-pnpm/**
      - toolchains/simple-pnpm/**
      - toolchains/subprocess_util.py
      - toolchains/pnpm_script.bzl
      - toolchains/BUCK
      - .github/workflows/ci-task-tests.yml

permissions:
  contents: read

jobs:
  integration-artifacts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: carvel-dev/setup-action@v2
        with:
          only: ytt
      - name: Check integration artifact upload conditions
        run: python3 -m unittest discover -s ci/tests -v

  chart-pr-task:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test chart bump and PR tasks
        run: python3 -m unittest discover -s ci/core/tasks/tests -v

  pnpm-subprocess:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Test pnpm subprocess handling
        run: python3 -m unittest discover -s toolchains/workspace-pnpm -p 'test_*.py' -v
