query Globals {
  globals {
    network
    nodesIds
    blockInfo {
      blockHash
      blockHeight
    }
    feesInformation {
      deposit {
        minBankFee
        minBankFeeThreshold
        tiers {
          maxAmount
          amount
        }
      }
    }
    accountLimitsByLevel {
      level
      interval
      withdrawal
      internalSend
      convert
    }
  }
}
